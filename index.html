<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra Funda Pizza e Vinho</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Personalizações de Scroll e Animações */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 10px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .modal-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .toast-enter { opacity: 1 !important; transform: translate(-50%, -20px) !important; }
        
        /* Estilização para Rádios Visuais (Botões de Seleção) */
        .radio-card:has(:checked) { border-color: #dc2626; background-color: #fef2f2; box-shadow: 0 0 0 1px #dc2626; }
        .radio-card:has(:checked) .radio-icon { color: #dc2626; }
    </style>
</head>

                <li><a href="#pizzas-doces" class="hover:text-red-700 transition">Pizzas Doces</a></li>

        </div>
    </div>

    <main class="container mx-auto px-4" id="menu-container">
        <!-- Itens injetados via JS -->
    </main>

        function renderMenu() {
            const container = document.getElementById('menu-container');
            const categorias = [
                { id: 'pizzas-salgadas', title: 'Pizzas Salgadas', filter: i => i.categoria === 'salgada' },
                { id: 'pizzas-doces', title: 'Pizzas Doces', filter: i => i.categoria === 'doce' },
                { id: 'bebidas', title: 'Bebidas', filter: i => i.tipo === 'bebida' }
            ];

            let html = '';
            categorias.forEach(cat => {
                const itens = db.filter(cat.filter);
                if (itens.length === 0) return;

                html += `
                    <section id="${cat.id}" class="pt-8 mb-8 scroll-mt-24">
                        <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b-2 border-red-100 pb-2 inline-block">${cat.title}</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                `;

                    const descText = item.descricao ? `<p class="text-sm text-gray-500 mt-1 mb-3 line-clamp-2">${item.descricao}</p>` : '';
                    
                    let priceText = '';
                    if (item.tipo === 'pizza') {
                        priceText = `
                            <div class="flex flex-col text-sm text-gray-600 gap-0.5">
                                <span>Grande: <strong class="text-green-600">${formatMoney(item.precos.grande)}</strong></span>

                        `;
                    } else {
                        priceText = `<span class="font-bold text-lg text-green-600 mt-2 block">${formatMoney(item.preco)}</span>`;
                    }

                    html += `
                        <div class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md border border-gray-100 flex flex-col justify-between cursor-pointer transition transform hover:-translate-y-1" onclick="openModalItem(${item.id})">
                            <div>
                                <h3 class="font-bold text-gray-800 text-lg leading-tight">${item.nome}</h3>
                                ${descText}
                            </div>
                            <div class="flex justify-between items-end mt-4">
                                <div>${priceText}</div>
                                <button class="bg-red-50 text-red-600 rounded-xl w-10 h-10 flex items-center justify-center hover:bg-red-600 hover:text-white transition-colors shadow-sm shrink-0 ml-2">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += `</div></section>`;
            });
            container.innerHTML = html;
        }

        function openModalItem(id) {
            itemAtual = { ...db.find(i => i.id === id) };
            const content = document.getElementById('item-modal-content');
            
            let html = `
                <h3 class="text-2xl font-bold text-gray-800 mb-1">${itemAtual.nome}</h3>
                ${itemAtual.descricao ? `<p class="text-gray-500 text-sm mb-5">${itemAtual.descricao}</p>` : ''}
            `;

            if (itemAtual.tipo === 'pizza') {
                const outrasPizzas = db.filter(i => i.categoria === itemAtual.categoria && i.id !== itemAtual.id);
                
                html += `
                    <!-- Seleção de Tamanho -->
                    <div class="my-6">
                        <h4 class="font-bold text-sm text-gray-500 uppercase tracking-wider mb-3">Tamanho</h4>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="radio-card border border-gray-200 rounded-xl p-3 cursor-pointer text-center transition">
                                <input type="radio" name="pizza_size" value="grande" checked class="hidden" onchange="updateModalPrice()">
                                <div class="font-bold text-gray-800">Grande</div>
                                <div class="text-sm text-gray-500">8 Fatias</div>
                            </label>
                            <label class="radio-card border border-gray-200 rounded-xl p-3 cursor-pointer text-center transition">
                                <input type="radio" name="pizza_size" value="broto" class="hidden" onchange="updateModalPrice()">
                                <div class="font-bold text-gray-800">Broto</div>
                                <div class="text-sm text-gray-500">4 Fatias</div>
                            </label>
                        </div>
                    </div>

                    <!-- Seleção de Formato (1 ou 2 Sabores) -->
                    <div class="mb-6">
                        <h4 class="font-bold text-sm text-gray-500 uppercase tracking-wider mb-3">Formato</h4>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <label class="radio-card border border-gray-200 rounded-xl p-3 cursor-pointer flex items-center gap-2 transition">
                                <input type="radio" name="pizza_format" value="1" checked class="hidden" onchange="updateModalPrice()">
                                <i class="fa-solid fa-circle-check radio-icon text-gray-300"></i>
                                <span class="font-medium text-gray-700">1 Sabor</span>
                            </label>
                            <label class="radio-card border border-gray-200 rounded-xl p-3 cursor-pointer flex items-center gap-2 transition">
                                <input type="radio" name="pizza_format" value="2" class="hidden" onchange="updateModalPrice()">
                                <i class="fa-solid fa-circle-check radio-icon text-gray-300"></i>
                                <span class="font-medium text-gray-700">Meio a Meio</span>
                            </label>
                        </div>
                        
                        <div id="div-segundo-sabor" class="hidden animate-[slideUp_0.2s_ease-out]">
                            <p class="text-xs text-red-500 mb-2 font-medium bg-red-50 p-2 rounded-lg">* Na pizza meio a meio, será cobrado o valor do sabor mais caro do tamanho escolhido.</p>
                            <select id="segundo-sabor" class="w-full border border-gray-300 p-3 rounded-xl bg-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition" onchange="updateModalPrice()">
                                <option value="" disabled selected>Escolha o 2º Sabor...</option>
                                ${outrasPizzas.map(p => `<option value="${p.id}">${p.nome}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;
            }

            html += `
                <div class="mb-6">
                    <h4 class="font-bold text-sm text-gray-500 uppercase tracking-wider mb-3">Observações</h4>
                    <textarea id="item-obs" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition resize-none" rows="2" placeholder="Ex: Tirar cebola, ponto da carne..."></textarea>
                </div>
                
                <div class="flex items-center justify-between border-t border-gray-100 pt-4 mt-2">
                    <span class="text-2xl font-bold text-gray-800" id="modal-preco-display">R$ 0,00</span>
                    <button onclick="adicionarAoCarrinho()" class="bg-red-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-red-700 transition shadow-lg">
                        Adicionar
                    </button>
                </div>
            `;

            content.innerHTML = html;
            document.getElementById('item-modal').classList.remove('hidden');
            
            // Força a atualização do preço inicial
            setTimeout(updateModalPrice, 10);
        }

        function closeItemModal() {
            document.getElementById('item-modal').classList.add('hidden');
        }

        function updateModalPrice() {
            if (itemAtual.tipo !== 'pizza') {
                document.getElementById('modal-preco-display').textContent = formatMoney(itemAtual.preco);
                return;
            }

            const sizeRadio = document.querySelector('input[name="pizza_size"]:checked');
            const formatRadio = document.querySelector('input[name="pizza_format"]:checked');
            
            if (!sizeRadio || !formatRadio) return;

            const size = sizeRadio.value; // 'grande' ou 'broto'
            const isDoisSabores = formatRadio.value === "2";
            const selectSabor2 = document.getElementById('segundo-sabor');
            const divSabor2 = document.getElementById('div-segundo-sabor');

            let finalPrice = itemAtual.precos[size];

            if (isDoisSabores) {
                divSabor2.classList.remove('hidden');
                if (selectSabor2.value) {
                    const sabor2 = db.find(i => i.id === parseInt(selectSabor2.value));
                    if (sabor2) {
                        finalPrice = Math.max(itemAtual.precos[size], sabor2.precos[size]);
                    }
                }
            } else {
                divSabor2.classList.add('hidden');
                selectSabor2.value = "";
            }

            document.getElementById('modal-preco-display').textContent = formatMoney(finalPrice);
        }

        function adicionarAoCarrinho() {
            let itemName = itemAtual.nome;
            let itemPrice = 0;
            let detailString = "";
            const obs = document.getElementById('item-obs') ? document.getElementById('item-obs').value.trim() : "";

            if (itemAtual.tipo === 'pizza') {
                const size = document.querySelector('input[name="pizza_size"]:checked').value;
                const isDoisSabores = document.querySelector('input[name="pizza_format"]:checked').value === "2";
                
                let basePrice = itemAtual.precos[size];

                if (isDoisSabores) {
                    const select2 = document.getElementById('segundo-sabor');
                    if (!select2.value) {
                        showToast("Selecione o 2º sabor para a pizza meio a meio.");
                        return;
                    }
                    const sabor2 = db.find(i => i.id === parseInt(select2.value));
                    itemName = `1/2 ${itemAtual.nome.split('. ')[1] || itemAtual.nome} e 1/2 ${sabor2.nome.split('. ')[1] || sabor2.nome}`;
                    basePrice = Math.max(itemAtual.precos[size], sabor2.precos[size]);
                }

                itemPrice = basePrice;
                detailString = size === 'grande' ? 'Tamanho: Grande' : 'Tamanho: Broto';
            } else {
                itemPrice = itemAtual.preco;
            }

            cart.push({
                idCart: Date.now(),
                nome: itemName,
                preco: itemPrice,
                detalhes: detailString,
                obs: obs
            });

            closeItemModal();
            updateCartUI();
            showToast("Item adicionado ao carrinho!");
        }

        function updateCartUI() {
            const btn = document.getElementById('cart-float-btn');
            if (cart.length > 0) {
                btn.classList.remove('hidden');
                document.getElementById('cart-float-count').textContent = cart.length;
                const total = cart.reduce((acc, curr) => acc + curr.preco, 0);
                document.getElementById('cart-float-total').textContent = formatMoney(total);
            } else {
                btn.classList.add('hidden');
                closeCartModal(); // Fecha se esvaziar
            }
        }

        function openCartModal() {
            renderCartItems();
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items-container');
            const totalEl = document.getElementById('checkout-total-price');
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-10 font-medium">Seu carrinho está vazio.</p>';
                totalEl.textContent = 'R$ 0,00';
                return;
            }

            let html = '';
            let total = 0;

            cart.forEach(item => {
                total += item.preco;
                html += `
                    <div class="flex justify-between items-start mb-4 bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                        <div class="flex-1 pr-3">
                            <h4 class="font-bold text-gray-800">${item.nome}</h4>
                            ${item.detalhes ? `<p class="text-xs text-gray-500 mt-1 font-medium bg-gray-100 inline-block px-2 py-1 rounded">${item.detalhes}</p>` : ''}
                            ${item.obs ? `<p class="text-sm text-gray-600 mt-2 italic">Obs: ${item.obs}</p>` : ''}
                            <p class="font-bold text-green-600 text-sm mt-2">${formatMoney(item.preco)}</p>
                        </div>
                        <button type="button" onclick="removeFromCart(${item.idCart})" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            });

            container.innerHTML = html;
            totalEl.textContent = formatMoney(total);
        }

        function removeFromCart(idCart) {
            cart = cart.filter(c => c.idCart !== idCart);
            renderCartItems();
            updateCartUI();
        }

        function toggleDeliveryFields() {
            const isDelivery = document.querySelector('input[name="orderType"]:checked').value === 'delivery';
            const fieldsDiv = document.getElementById('delivery-fields');
            const inputAddress = document.getElementById('cliente-endereco');

            if (isDelivery) {
                fieldsDiv.classList.remove('hidden');
                inputAddress.required = true;
            } else {
                fieldsDiv.classList.add('hidden');
                inputAddress.required = false;
                inputAddress.value = '';
                document.getElementById('has-complement').checked = false;
                document.getElementById('div-complemento').classList.add('hidden');
                document.getElementById('complemento-text').value = '';
            }
        }

        function toggleComplement() {
            const isChecked = document.getElementById('has-complement').checked;
            document.getElementById('div-complemento').classList.toggle('hidden', !isChecked);
            if (!isChecked) document.getElementById('complemento-text').value = '';
        }

        function finalizeOrder(e) {
            e.preventDefault();
            
            if (cart.length === 0) {
                showToast("Adicione produtos ao carrinho!");
                return;
            }

            const nome = document.getElementById('cliente-nome').value.trim();
            const telefone = document.getElementById('cliente-tel').value.trim();
            const pagamento = document.getElementById('cliente-pagamento').value;
            const tipo = document.querySelector('input[name="orderType"]:checked').value;
            
            let enderecoStr = "";
            if (tipo === 'delivery') {
                enderecoStr = document.getElementById('cliente-endereco').value.trim();
                const comp = document.getElementById('complemento-text').value.trim();
                if (comp) enderecoStr += ` (Complemento: ${comp})`;
            }

            // Construção da Mensagem
            let txt = `*NOVO PEDIDO - BARRA FUNDA PIZZA E VINHO* 🍕\n\n`;
            txt += `*Cliente:* ${nome}\n`;
            txt += `*Contato:* ${telefone}\n`;
            txt += `*Tipo:* ${tipo === 'delivery' ? '🛵 Delivery' : '🏪 Retirada no balcão'}\n`;
            
            if (tipo === 'delivery') {
                txt += `*Endereço:* ${enderecoStr}\n`;
            }
            
            txt += `*Pagamento:* ${pagamento}\n\n`;
            txt += `*------------ ITENS ------------*\n\n`;

            let total = 0;
            cart.forEach((item, index) => {
                total += item.preco;
                txt += `*${index + 1}. ${item.nome}*\n`;
                if (item.detalhes) txt += `   ↳ ${item.detalhes}\n`;
                if (item.obs) txt += `   ↳ _Obs: ${item.obs}_\n`;
                txt += `   ↳ Valor: ${formatMoney(item.preco)}\n\n`;
            });

            txt += `*-------------------------------*\n`;
            txt += `*TOTAL A PAGAR: ${formatMoney(total)}*`;

            const linkData = encodeURIComponent(txt);
            const waLink = `https://wa.me/${WHATSAPP_NUM}?text=${linkData}`;
            
            window.open(waLink, '_blank');
            
            // Opcional: Esvaziar carrinho após enviar
            // cart = [];
            // updateCartUI();
            // closeCartModal();
        }

        // Iniciar
        window.onload = init;
    </script>
</body>
</html>
